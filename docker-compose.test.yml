version: '3.8'

services:
  backend:
    image: armonica21/etl-backend-mercado-spot:latest
    container_name: etl-backend-mercado-spot
    ports:
      - "8095:8080"
    environment:
      - SPRING_PROFILE=prod
      - PORT=8080
      - SUPERBASE_URL=${SUPERBASE_URL}
      - SUPERBASE_USER=${SUPERBASE_USER}
      - SUPERBASE_PASS=${SUPERBASE_PASS}
      - JWT_FIRMA=${JWT_FIRMA}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - LOGGING_FILE_NAME=logs/application.log
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    restart: unless-stopped