spring.application.name=Mercado_Spot

# definimos un puerto y una URL para entrar con swagger
server.port=${SERVER_PORT_PROD}
spring.jpa.open-in-view=false

# agregamos los datos para la conexion
spring.datasource.url=${SUPERBASE_URL}
spring.datasource.username=${SUPERBASE_USER}
spring.datasource.password=${SUPERBASE_PASS}

# agregamos configuraciones de hibernate para ver en terminal
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# visualizamos las querys al momento de la realizacion de la peticion
spring.jpa.properties.hibernate.format_sql=false

# agregamos el volumen para manejar tanto videos como fotos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Logging Configuration
logging.level.com.safiraenergia.mercadospot=INFO
logging.level.org.springframework.security=WARN 
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# File logging
logging.file.name=logs/application.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} - %msg%n

# Archivo específico para errores de ETL
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# HikariCP configuration for better connection handling
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000

# Hibernate configuration
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

spring.transaction.default-timeout=120

# Configuracion para monitoreo del Garbage Collector
management.endpoints.web.exposure.include=health,info,metrics,gc
management.metrics.enable.jvm.gc=true
management.endpoint.metrics.enabled=true

# Log para el Garbage Collector
logging.level.com.safiraenergia.mercadospot.config.GarbageCollectorMonitoringConfig=DEBUG

# para mostrar el error real
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true