spring.application.name=Mercado-Spot-Test

server.port=0

# Base de datos H2
spring.datasource.url=jdbc:h2:~/test_mercado;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.safiraenergia.mercadospot=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Archivo de log
logging.file.name=logs/test-application.log

# JWT
JWT_EXPIRATION=86400000
JWT_FIRMA=testSecretKeyForJWTThatIsAtLeast64CharactersLong12345678901234567890

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# HikariCP
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ETL
elt.batch.size=10